version: '3.8'

services:
  api_agent-store:
    working_dir: /docker_api_agent-store
    restart: always
    image: dazaipr/agent-store:1.0
    volumes:
      - ./:/docker_api_agent-store
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: adk web --host 0.0.0.0 --port 8000

  db:
    image: postgres:15
    container_name: journals_db
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    restart: always  

  api_backend:
    working_dir: /docker_api_backend
    restart: always
    image: dazaipr/agent-store:1.0
    volumes:
      - ./backend:/docker_api_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8080
